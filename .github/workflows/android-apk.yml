name: Android APK

on:
  push:
    branches: [main, "feat/**", "fix/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          package-manager-cache: false

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Android SDK 36
        uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools platforms;android-36 build-tools;36.0.0"

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Test web game
        run: npm test

      - name: Build web bundle
        run: npm run build

      - name: Generate Android project
        run: npx cap add android

      - name: Sync web assets
        run: npx cap sync android

      - name: Configure Android app
        run: |
          sed -i 's/versionCode 1/versionCode 2/' android/app/build.gradle
          sed -i 's/versionName "1.0"/versionName "0.2.1"/' android/app/build.gradle
          sed -i 's/android:theme="@style\/AppTheme"/android:theme="@style\/AppTheme" android:screenOrientation="portrait"/' android/app/src/main/AndroidManifest.xml

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Verify APK signing and alignment
        run: |
          APK="android/app/build/outputs/apk/debug/app-debug.apk"
          "$ANDROID_HOME/build-tools/36.0.0/zipalign" -c -v 4 "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$APK" | tee apk-badging.txt

      - name: Prepare artifact
        run: |
          mkdir -p artifacts
          cp android/app/build/outputs/apk/debug/app-debug.apk artifacts/Merge24-0.2.1-debug.apk
          cp apk-badging.txt artifacts/apk-badging.txt

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Merge24-0.2.1-debug-apk
          path: artifacts/
          if-no-files-found: error
          retention-days: 30

  install-test:
    needs: build-apk
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Download APK artifact
        uses: actions/download-artifact@v5
        with:
          name: Merge24-0.2.1-debug-apk
          path: artifacts

      - name: Install and launch on Android 13 emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: |
            adb install -r artifacts/Merge24-0.2.1-debug.apk
            adb shell pm list packages | grep com.hazhanhasani.merge24
            adb shell monkey -p com.hazhanhasani.merge24 -c android.intent.category.LAUNCHER 1
